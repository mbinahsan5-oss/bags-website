<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Store admin</title>
<link rel="stylesheet" href="css/style.css"><link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet"></head><body>
<div id="login" class="box" style="max-width:380px;margin:12vh auto"><h2>Admin login</h2><form id="lf"><label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password"><p id="le" role="alert" style="color:#a01048"></p><button class="btn">Sign in</button></form><p>First time? The password is <b>admin123</b>. Change it in Store, contact and SEO.</p></div>
<div id="app" class="adm" hidden><nav class="side" id="sd" aria-label="Admin"></nav><div class="main" id="pn"></div></div>
<dialog id="pf"><button class="x" data-close aria-label="Close">&times;</button><h2 id="pt2">Product</h2><form id="pform"><label for="a1">Name</label><input id="a1" required><div class="f2"><div><label for="a2">Category</label><select id="a2"></select></div><div><label for="a6">Color (used when no photo)</label><input id="a6" type="color" value="#ff5fa2"></div><div><label for="a3">Price (PKR)</label><input id="a3" type="number" min="0" step="1" required></div><div><label for="a4">Sale price (0 = none)</label><input id="a4" type="number" min="0" step="1" value="0"></div></div><label for="a5">Stock</label><input id="a5" type="number" min="0" value="10"><label for="a7">Description</label><textarea id="a7" rows="3"></textarea>
<div class="imgf"><span class="lb">Product photo</span><div class="prev" id="pv"></div><label class="ib">Replace image<input id="a8" type="file" accept="image/*" hidden></label><button type="button" class="ib d" id="rmi">Remove</button></div>
<label style="font-weight:400"><input type="checkbox" id="a9" style="width:auto;min-height:0"> Photo has a white background</label><label style="font-weight:400"><input type="checkbox" id="b1" style="width:auto;min-height:0"> Show Best seller badge</label><label style="font-weight:400"><input type="checkbox" id="b2" style="width:auto;min-height:0"> Hide from store</label><p></p><button class="btn">Save product</button></form></dialog>
<div id="ts" role="status" hidden></div>
<script src="js/store.js"></script><script src="js/admin.js"></script></body></html>
